name: Devfolio Studio quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reviewed dependency lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'ERROR: Run npm install locally and commit package-lock.json before merging or deploying.'
            exit 1
          fi
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:phase6
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ROOT_DOMAIN: localhost
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
