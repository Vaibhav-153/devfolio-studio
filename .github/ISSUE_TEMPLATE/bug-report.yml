name: Beta bug report
about: Report a reproducible issue without including credentials or user data
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: "Please do not include API keys, passwords, private user records, or screenshots of sensitive data."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Explain the problem in your own words.
      placeholder: I expected the project card to show the new image, but it stayed blank.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open dashboard  2. Edit project  3. Save"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Authentication, Content dashboard, Visual editor, Image upload, Publishing, Mobile design, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows 11 / Safari on iPhone
